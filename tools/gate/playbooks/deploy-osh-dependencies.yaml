# Deploys the OpenStack-Helm services Deckhand integration tests depend on
# (Keystone and Barbican with their backing services) using the
# deploy-charts and deploy-ceph roles from openstack/openstack-helm.
---
- hosts: primary
  tasks:
    - name: Prepare Kubernetes
      include_role:
        name: deploy-charts
        tasks_from: prepare-k8s

    - name: Prepare charts
      include_role:
        name: deploy-charts
        tasks_from: prepare-charts

    - name: Setup OpenStack client
      include_role:
        name: deploy-charts
        tasks_from: setup-client

    - name: Deploy Ceph Rook
      include_role:
        name: deploy-ceph

    - name: Deploy Ceph adapter Rook
      include_role:
        name: deploy-charts
        tasks_from: ceph-adapter-rook

    - name: Deploy MariaDB
      include_role:
        name: deploy-charts
        tasks_from: mariadb

    - name: Deploy Memcached
      include_role:
        name: deploy-charts
        tasks_from: memcached

    - name: Deploy RabbitMQ
      include_role:
        name: deploy-charts
        tasks_from: rabbitmq

    - name: Deploy Keystone
      include_role:
        name: deploy-charts
        tasks_from: keystone

    # Barbican no longer ships a default simple_crypto KEK, so secret
    # creation fails with "SimpleCrypto KEK is undefined" unless one is set.
    - name: Create Barbican KEK values file
      copy:
        dest: /tmp/barbican-kek.yaml
        content: |
          conf:
            barbican:
              simple_crypto_plugin:
                kek: "dGhpcnR5X3R3b19ieXRlX2tleWJsYWhibGFoYmxhaGg="

    - name: Deploy Barbican
      include_role:
        name: deploy-charts
        tasks_from: barbican
      vars:
        osh_values_overrides_barbican:
          - /tmp/barbican-kek.yaml
...
